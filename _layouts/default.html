<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ site.description | default: '' }}" />
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand__name">Lucía Ferreño</span>
          <span class="brand__role">Data Analyst</span>
        </a>

        <nav class="nav">
          <a href="{{ '/' | relative_url }}#about">About</a>
          <a href="{{ '/' | relative_url }}#proyectos">Proyectos</a>
          <a href="{{ '/' | relative_url }}#cv">CV</a>
          <a href="{{ '/' | relative_url }}#contacto">Contacto</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>© {{ site.time | date: '%Y' }} · Lucía Ferreño</span>
      </div>
    </footer>
  </body>
</html>
