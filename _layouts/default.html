<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ site.description | default: '' }}" />

    <!-- Work Sans (similar a dalyabaron.com) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Your custom CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand__name">Lucía Ferreño</span>
          <span class="brand__role">Data Analyst</span>
        </a>

        <nav class="nav">
          <a href="{{ '/projects/' | relative_url }}">Proyectos</a>
          <a href="{{ '/cv/' | relative_url }}">CV y Certificados</a>
          <a href="{{ '/about/' | relative_url }}">Sobre mí</a>
          <a href="{{ '/contact/' | relative_url }}">Contacto</a>
        </nav>
      </div>
    </header>

    <main class="container">
  {{ content }}
</main>


    <footer class="site-footer">
      <div class="container footer-inner">
        <span>© {{ site.time | date: '%Y' }} · Lucía Ferreño</span>
      </div>
    </footer>
  </body>
</html>
